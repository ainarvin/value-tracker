name: Refresh stock snapshot

on:
  schedule:
    # Every 30 min, Mon-Fri, 00:00-21:59 UTC: covers Bursa Malaysia, Europe and US market hours.
    - cron: "*/30 0-21 * * 1-5"
    # Once on Saturday so weekend viewers see Friday's close.
    - cron: "0 6 * * 6"
  workflow_dispatch: {}          # "Run workflow" button on GitHub (works from your phone)
  push:
    paths: ["valuation.json", "value_tracker.py", "index.html"]

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build snapshot
        run: python value_tracker.py --export docs
      - name: Publish snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
